# AI Football Nginx 配置
# 用法：
#   1. 把这个文件放到 /etc/nginx/nginx.conf 或 include 到你的 conf.d
#   2. 修改下面的路径和端口
#   3. nginx -t && nginx -s reload

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 上游 FastAPI
    upstream football_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;   # 或你的域名

        # 维护页
        proxy_intercept_errors on;
        error_page 500 502 503 504 /maintenance.html;

        location = /maintenance.html {
            root /Users/xian/Java/ai-football/backend/static;  # ← 改成你的实际路径
            internal;
        }

        # 静态文件（可选，加速）
        location /static/ {
            alias /Users/xian/Java/ai-football/backend/static/;  # ← 改成你的实际路径
            expires 7d;
        }

        # 代理到 FastAPI
        location / {
            proxy_pass http://football_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 超时
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;

            # 后端挂了返回维护页
            proxy_intercept_errors on;
            error_page 502 503 504 /maintenance.html;
        }
    }
}
