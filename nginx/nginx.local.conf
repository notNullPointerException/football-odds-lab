# macOS 本地 Nginx 配置（Homebrew 安装的 nginx）
# 放到 /opt/homebrew/etc/nginx/nginx.conf 或 include

upstream football_backend {
    server 127.0.0.1:8000;
}

server {
    listen 8080;          # 用 8080，避免和系统 80 冲突
    server_name localhost;

    proxy_intercept_errors on;
    error_page 500 502 503 504 /maintenance.html;

    location = /maintenance.html {
        # 改成你项目的实际路径
        root /Users/xian/Java/ai-football/backend/static;
        internal;
    }

    location / {
        proxy_pass http://football_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 503 504 /maintenance.html;
    }
}
