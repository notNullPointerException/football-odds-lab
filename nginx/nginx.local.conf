# macOS 本地 Nginx 完整配置（可直接用 nginx -c 启动）
# 用法：nginx -c /Users/xian/Java/ai-football/nginx/nginx.local.conf
#
# 前面必须要有 worker_processes / events / http 这三层：这是完整的 nginx.conf，
# 不是可以塞进 http{} 里的片段（旧版只有 upstream+server，nginx -c 会报
# "upstream directive is not allowed here"）。

worker_processes 1;
pid /tmp/ai-football-nginx.pid;
error_log /tmp/ai-football-nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/ai-football-nginx-access.log;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # 慢连接防护（防 slowloris 之类一直占着连接不发完）
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;

    # ── 单 IP 限流 ──────────────────────────────────────────
    # cloudflared 在 127.0.0.1：直接用 $remote_addr 会把【所有访客】算成
    # 同一个 IP，一个人刷新就把全站拖下水。Cloudflare 会覆盖 CF-Connecting-IP，
    # 优先用它；本地直连（没有这个头）再退回 remote_addr。
    map $http_cf_connecting_ip $client_key {
        default $http_cf_connecting_ip;
        ""      $binary_remote_addr;
    }

    # 15 请求/秒（桶容量 60，用来接页面加载的并发请求）
    limit_req_zone $client_key zone=req_per_ip:10m rate=15r/s;
    # 同一 IP 最多同时 60 个连接
    limit_conn_zone $client_key zone=conn_per_ip:10m;

    upstream football_backend {
        server 127.0.0.1:8000;
    }

    server {
        # 只监听本机：cloudflared 从 127.0.0.1 连进来，不把 8080 暴露到局域网
        listen 127.0.0.1:8080;
        server_name localhost;

        # 超限回 429（默认是 503，会被下面的 error_page 当成维护页，误导用户）
        limit_req zone=req_per_ip burst=60 nodelay;
        limit_conn conn_per_ip 60;
        limit_req_status 429;
        limit_conn_status 429;

        # 后端 502/503/504 时给维护页。
        # ⚠️ 必须 =200：Cloudflare quick tunnel 会把源站的 5xx 换成它自己的
        #    "502 Bad gateway" 页，维护页正文根本传不到用户。200 才能把页面送达。
        proxy_intercept_errors on;
        error_page 500 502 503 504 =200 /maintenance.html;

        # internal：外部直接访问 /maintenance.html 拿不到，只能由 error_page 内部跳转
        location = /maintenance.html {
            root /Users/xian/Java/ai-football/backend/static;
            internal;
        }

        # 预览入口：随时能看维护页长什么样，不影响正常访问
        location = /maintenance-preview.html {
            alias /Users/xian/Java/ai-football/backend/static/maintenance.html;
        }

        location / {
            # 手动维护开关：touch /tmp/ai-football-maintenance.on 后全站进维护页；
            # rm 掉就恢复。不用停 FastAPI，适合升级前挂公告。
            if (-f /tmp/ai-football-maintenance.on) {
                return 503;
            }

            proxy_pass http://football_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }
    }
}
