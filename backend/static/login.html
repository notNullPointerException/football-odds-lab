<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<title>登录 · AI Football</title>
<link rel="preload" as="image" href="/login-bg.webp">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  display: flex;
  /* 原来是 align-items:center + overflow:hidden：卡片比手机屏高时，
     上下多出来的部分会被直接裁掉且滚不动 —— 登录/注册按钮就点不到了。
     改成 flex-start + 卡片 auto 外边距：装得下就居中，装不下就从顶部排、页面可滚。 */
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
  background: #0a0c10;
}
.bg {
  position: fixed; inset: 0;
  background: url("/login-bg.webp") center/cover no-repeat;
  filter: brightness(0.45);
  animation: kenburns 8s ease-in-out infinite alternate;
  z-index: 0;
}
@keyframes kenburns {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.08) translate(-1%, -1%); }
}
.card {
  position: relative;
  z-index: 1;
  width: 380px;
  max-width: 100%;
  margin: auto;
  background: rgba(18, 20, 26, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 16px;
  padding: 36px 32px;
  color: #e6e9ef;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.card h1 {
  text-align: center;
  font-size: 22px;
  margin-bottom: 6px;
  font-weight: 600;
}
.card .sub {
  text-align: center;
  color: #8b93a5;
  font-size: 13px;
  margin-bottom: 24px;
}
.tabs {
  display: flex;
  margin-bottom: 20px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.tabs button {
  flex: 1;
  background: none;
  border: none;
  color: #8b93a5;
  padding: 10px 0;
  font-size: 15px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
.tabs button.on {
  color: #4a9eff;
  border-bottom-color: #4a9eff;
}
input {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 12px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px;
  color: #e6e9ef;
  font-size: 14px;
  outline: none;
}
input:focus { border-color: #4a9eff; }
.captcha-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
  align-items: center;
}
.captcha-row input { flex: 1; margin-bottom: 0; }
.captcha-row img {
  height: 60px;
  border-radius: 6px;
  cursor: pointer;
  background: #1e222b;
}
.pass-wrap {
  position: relative;
  margin-bottom: 12px;
}
.pass-wrap input {
  width: 100%;
  margin-bottom: 0;
  padding-right: 46px;   /* 给右侧的眼睛图标留位，避免文字被盖住 */
}
.eye {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: 0;
  border-radius: 6px;
  color: #8b93a5;
  cursor: pointer;
}
.eye:hover { color: #e6e9ef; background: rgba(255,255,255,.08); }
.eye svg { width: 20px; height: 20px; display: block; }
.eye .eye-off { display: none; }
.eye.on .eye-on { display: none; }
.eye.on .eye-off { display: block; }
/* 保持登录：网页没有系统密码管理器，靠长期 token 免密，不是存密码 */
.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 12px;
  color: #8b93a5;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.remember input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  margin: 0;
  padding: 0;
  flex: none;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 4px;
  background: rgba(255,255,255,.06);
  position: relative;
  cursor: pointer;
}
.remember input[type="checkbox"]:checked {
  background: #4a9eff;
  border-color: #4a9eff;
}
.remember input[type="checkbox"]:checked::after {
  content: "";
  position: absolute;
  left: 5px;
  top: 2px;
  width: 4px;
  height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.remember .tip { margin-left: auto; color: #6b7383; font-size: 12px; }
.btn {
  width: 100%;
  padding: 12px;
  background: #4a9eff;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
}
.btn:hover { background: #3a8eef; }
.msg {
  color: #f87171;
  font-size: 13px;
  text-align: center;
  margin-top: 12px;
  min-height: 18px;
}
.hint {
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
  color: #8b93a5;
}
.hint a { color: #4a9eff; cursor: pointer; text-decoration: none; }
@media (max-width: 480px) {
  body { padding: 16px; }
  .card { padding: 28px 20px; }
  /* iOS 聚焦 <16px 的输入框会自动放大页面；按手机规格提到 16px */
  input { font-size: 16px; }
}
</style>
</head>
<body>

<!-- MP3 放第一个：手机端只加载 3.8MB，避免 112MB FLAC 缓冲卡顿；FLAC 仅作兜底 -->
<audio id="bgm" loop preload="auto" playsinline>
  <source src="/media/MIRBRO - C R 7_EM.mp3" type="audio/mpeg">
  <source src="/media/MIRBRO - C R 7_EM.flac" type="audio/flac">
</audio>

<div class="bg"></div>
<div class="card">
  <h1>AI Football</h1>
  <p class="sub">胜负彩预测控制台</p>
  <div class="tabs">
    <button id="tab-login" class="on">登录</button>
    <button id="tab-register">注册</button>
  </div>

  <!-- 登录 -->
  <div id="panel-login">
    <!-- 手机键盘防护：iOS/微信会自动把首字母大写、联想改写，
         中文输入法还可能打出全角 ［ ／ 首尾空格 —— 用户看不到，只会得到 401。
         autocapitalize/autocorrect 关掉这些；密码框内放一个眼睛图标便于自己核对。 -->
    <input id="login-user" placeholder="用户名" maxlength="8"
           autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <div class="pass-wrap">
      <input id="login-pass" type="password" placeholder="密码" maxlength="12"
             autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button type="button" class="eye" id="toggle-login-pass" aria-label="显示密码" title="显示密码"
              aria-pressed="false">
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <div class="captcha-row">
      <input id="login-captcha" placeholder="验证码"
             autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <img id="login-captcha-img" title="点击刷新">
    </div>
    <label class="remember" for="login-remember">
      <input type="checkbox" id="login-remember" checked>
      <span>保持登录</span>
      <span class="tip">30 天内免密码</span>
    </label>
    <button class="btn" id="btn-login">登录</button>
    <p class="msg" id="login-msg"></p>
  </div>

  <!-- 注册 -->
  <div id="panel-register" style="display:none">
    <input id="reg-user" placeholder="用户名（最长8位）" maxlength="8"
           autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <div class="pass-wrap">
      <input id="reg-pass" type="password" placeholder="密码（最长12位）" maxlength="12"
             autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button type="button" class="eye" id="toggle-reg-pass" aria-label="显示密码" title="显示密码"
              aria-pressed="false">
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <div class="pass-wrap">
      <input id="reg-pass2" type="password" placeholder="确认密码" maxlength="12"
             autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button type="button" class="eye" id="toggle-reg-pass2" aria-label="显示密码" title="显示密码"
              aria-pressed="false">
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <div class="captcha-row">
      <input id="reg-captcha" placeholder="验证码"
             autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <img id="reg-captcha-img" title="点击刷新">
    </div>
    <button class="btn" id="btn-register">注册</button>
    <p class="msg" id="reg-msg"></p>
  </div>
</div>

<!-- 登录成功后的「记住账号密码？」确认（等价于浏览器的保存密码弹窗） -->
<div id="remember-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:110;align-items:center;justify-content:center;padding:24px;">
  <div style="background:#1e222b;border-radius:14px;padding:24px;max-width:340px;width:100%;color:#e6e9ef;box-shadow:0 20px 60px rgba(0,0,0,.5);">
    <h3 style="font-size:17px;margin-bottom:18px;font-weight:600;">记住账号密码？</h3>
    <div style="display:flex;gap:10px;">
      <button id="remember-no" style="flex:1;padding:11px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:none;color:#8b93a5;font-size:14px;cursor:pointer;">不记住</button>
      <button id="remember-yes" style="flex:1;padding:11px;border-radius:8px;border:0;background:#4a9eff;color:#fff;font-size:14px;font-weight:600;cursor:pointer;">记住</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

// 切登录/注册页时把上一页的错误提示清掉：否则「没注册先登录 → 当前用户名不存在」
// 会跟着用户去注册，注册完切回登录页时红字还挂着，看起来像刚报的错。
function clearAuthMsgs() {
  const lm = $("#login-msg"), rm = $("#reg-msg");
  if (lm) lm.textContent = "";
  if (rm) rm.textContent = "";
}

// tabs
$("#tab-login").onclick = () => {
  clearAuthMsgs();
  $("#tab-login").classList.add("on");
  $("#tab-register").classList.remove("on");
  $("#panel-login").style.display = "block";
  $("#panel-register").style.display = "none";
};
$("#tab-register").onclick = () => {
  clearAuthMsgs();
  $("#tab-register").classList.add("on");
  $("#tab-login").classList.remove("on");
  $("#panel-register").style.display = "block";
  $("#panel-login").style.display = "none";
  loadCaptcha();
};

// captcha
async function loadCaptcha() {
  const img = $("#reg-captcha-img");
  if (!img) return;
  const r = await fetch("/api/auth/captcha");
  const cid = r.headers.get("X-Captcha-Id");
  const blob = await r.blob();
  img.src = URL.createObjectURL(blob);
  img.dataset.cid = cid;
}
$("#reg-captcha-img").onclick = loadCaptcha;

// login
async function loadLoginCaptcha() {
  const img = $("#login-captcha-img");
  if (!img) return;
  const r = await fetch("/api/auth/captcha");
  const cid = r.headers.get("X-Captcha-Id");
  const blob = await r.blob();
  img.src = URL.createObjectURL(blob);
  img.dataset.cid = cid;
}
$("#login-captcha-img")?.addEventListener("click", loadLoginCaptcha);
loadLoginCaptcha();

// 手机输入法归一化。中文键盘容易把 [ 打成 ［、句末补空格、联想改字，
// 密码框里全是圆点，用户看不见，只会拿到「用户名或密码错误」。
// 用户名/验证码直接转半角；密码不静默改，注册时检测到就提示重输
// （登录页不报密码细节，失败一律按服务端原话显示）。
const halfWidth = s => s
  .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
  .replace(/　/g, " ");
const passwordNeedsRetry = p => p !== p.trim() || /[！-～　]/.test(p);

// 剪贴板/输入法偶尔带进零宽字符（U+200B、U+FEFF 等）或控制符，密码框里也是圆点，
// 肉眼看不出来，服务端只会回「用户名或密码错误」→ 提交前直接剔掉。
const stripInvisible = s => s.replace(/[\u0000-\u001F\u007F\u00AD\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g, "");

// 粘贴时整段替换输入框内容。手机密码框可能被系统自动填充占满 12 位（maxlength=12），
// 这时光标在末尾粘贴等于没反应，用户却以为已经换成自己复制的密码了。
function bindPasteReplace(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("paste", ev => {
    const t = (ev.clipboardData || window.clipboardData)?.getData("text");
    if (t == null) return;
    ev.preventDefault();
    el.value = t;
    el.dispatchEvent(new Event("input", { bubbles: true }));
  });
}
["login-user", "login-pass", "reg-user", "reg-pass", "reg-pass2"].forEach(bindPasteReplace);

// 密码框的眼睛图标：登录 + 注册两个密码框共用一套逻辑。
// 图标状态由 .on 控制（CSS 切换睁眼/闭眼），title/aria 只做无障碍提示。
function bindPassToggle(inputId, btnId) {
  const inp = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  if (!inp || !btn) return;
  btn.addEventListener("click", () => {
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    btn.classList.toggle("on", show);
    btn.title = show ? "隐藏密码" : "显示密码";
    btn.setAttribute("aria-label", btn.title);
    btn.setAttribute("aria-pressed", String(show));
  });
}
bindPassToggle("login-pass", "toggle-login-pass");
bindPassToggle("reg-pass", "toggle-reg-pass");
bindPassToggle("reg-pass2", "toggle-reg-pass2");

// ── 本机记住账号密码 ─────────────────────────────────────────
// 浏览器（尤其微信内置浏览器）不会让网页自己弹「保存密码？」，也没有密码管理器。
// 别人手机端的「记住密码」大多是站点自己存：登录成功后问一次，存在本机，
// 下次进登录页直接填好账号密码。这里照这个做法实现。
// ⚠️ base64 只是不让密码以明文肉眼可见，不是加密。
// 服务端仍然只存 bcrypt 哈希，这里只是浏览器本地的一份。
const SAVED_LOGIN_KEY = "saved_login";
function b64e(s) {
  let bin = "";
  new TextEncoder().encode(s).forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64d(s) {
  return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
}
function loadSavedLogin() {
  try {
    const o = JSON.parse(localStorage.getItem(SAVED_LOGIN_KEY) || "null");
    return o && o.u && o.p ? { u: o.u, p: b64d(o.p) } : null;
  } catch (e) { return null; }
}
function saveLogin(u, p) {
  localStorage.setItem(SAVED_LOGIN_KEY, JSON.stringify({ u, p: b64e(p) }));
}
function clearSavedLogin() {
  localStorage.removeItem(SAVED_LOGIN_KEY);
}
function askRememberLogin(u, p) {
  const modal = $("#remember-modal");
  if (!modal) { location.href = "/"; return; }
  $("#remember-yes").onclick = () => { saveLogin(u, p); location.href = "/"; };
  $("#remember-no").onclick = () => { clearSavedLogin(); location.href = "/"; };
  modal.style.display = "flex";
}
(function initSavedLogin() {
  const saved = loadSavedLogin();
  if (saved) {
    $("#login-user").value = saved.u;
    $("#login-pass").value = saved.p;
  } else {
    // 没存密码时至少带回上次的用户名
    const savedUser = localStorage.getItem("last_user");
    if (savedUser) $("#login-user").value = savedUser;
  }
  if (localStorage.getItem("login_remember") === "0") {
    $("#login-remember").checked = false;
  }
})();
$("#btn-login").onclick = async () => {
  const u = stripInvisible(halfWidth($("#login-user").value)).trim();
  const p = stripInvisible($("#login-pass").value);
  const ccode = halfWidth($("#login-captcha")?.value || "").trim();
  const cid = $("#login-captcha-img")?.dataset.cid || "";
  const remember = !!$("#login-remember")?.checked;
  const msg = $("#login-msg");
  if (!u || !p) { msg.textContent = "请填写用户名和密码"; return; }
  if (!ccode) { msg.textContent = "请输入验证码"; return; }
  const r = await fetch("/api/auth/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username: u, password: p, captcha_id: cid, captcha_code: ccode, remember})
  });
  const d = await r.json();
  if (r.ok) {
    localStorage.setItem("token", d.token);
    localStorage.setItem("last_user", u);
    localStorage.setItem("login_remember", remember ? "1" : "0");
    const saved = loadSavedLogin();
    if (saved && saved.u === u && saved.p === p) {
      location.href = "/";          // 账号密码没变，不再重复问
    } else {
      askRememberLogin(u, p);       // 第一次/换了账号：问一次「记住密码？」
    }
  } else {
    // 只显示服务端原话，不夹带用户名/密码长度/首尾字符等诊断信息：
    //   没注册 →「当前用户名不存在」；密码错 →「用户名或密码错误」
    msg.textContent = d.detail || "登录失败";
    document.getElementById("login-captcha").value = "";
    loadLoginCaptcha();
  }
};

// register
$("#btn-register").onclick = async () => {
  const u = stripInvisible(halfWidth($("#reg-user").value)).trim();
  const p = stripInvisible($("#reg-pass").value);
  const p2 = stripInvisible($("#reg-pass2").value);
  const ccode = halfWidth($("#reg-captcha").value).trim();
  const cid = $("#reg-captcha-img").dataset.cid || "";
  const msg = $("#reg-msg");
  if (!u || !p) { msg.textContent = "请填写用户名和密码"; return; }
  if (passwordNeedsRetry(p)) {
    msg.textContent = "密码里有全角字符或首尾空格，请切英文键盘重输（全角会被存成别的字符）";
    return;
  }
  if (u.length > 8) { msg.textContent = "用户名最长8位"; return; }
  if (p.length < 6) { msg.textContent = "密码至少6位"; return; }
  if (p.length > 12) { msg.textContent = "密码最长12位"; return; }
  if (p !== p2) { msg.textContent = "两次密码不一致"; return; }
  if (/^\d+$/.test(p) || /^[a-zA-Z]+$/.test(p)) { msg.textContent = "密码需包含字母和数字"; return; }
  if (!ccode) { msg.textContent = "请输入验证码"; return; }
  const r = await fetch("/api/auth/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username: u, password: p, plan: "week", captcha_id: cid, captcha_code: ccode})
  });
  const d = await r.json();
  if (r.ok) {
    // 注册成功后切回登录页，账号和密码都清空，让用户自己输。
    // 不清的话会留着本机「记住密码」里旧账号（比如 admin）的用户名+密码，
    // 用户以为填的是新账号，一点登录就是「用户名或密码错误」。
    $("#login-user").value = "";
    $("#login-pass").value = "";
    $("#login-captcha").value = "";
    document.getElementById("success-modal").style.display = "flex";
  } else {
    msg.textContent = d.detail || "注册失败";
    document.getElementById("reg-captcha").value = "";
    loadCaptcha();
  }
};

// hash #register 时自动切到注册
if (location.hash === "#register") {
  document.getElementById("tab-register").click();
}
// enter key
document.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    if ($("#panel-login").style.display !== "none") $("#btn-login").click();
    else $("#btn-register").click();
  }
});
</script>

<script>
(function(){
  var bgm = document.getElementById("bgm");
  if(bgm){
    function tryPlay(){
      bgm.play().catch(function(){});
    }
    document.addEventListener("click", function start(){
      tryPlay();
      var hint = document.getElementById("sound-hint");
      if(hint) hint.style.display = "none";
      document.removeEventListener("click", start);
    }, {once:true});
    tryPlay();
    // 页面切回来时恢复
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden) setTimeout(tryPlay, 200);
    });
    // 意外暂停时恢复
    bgm.addEventListener("pause", function(){
      if(!document.hidden && !bgm.ended) setTimeout(tryPlay, 300);
    });
    bgm.addEventListener("ended", tryPlay);
    // 定时检查，断了就续
    setInterval(function(){
      if(!document.hidden && bgm.paused && !bgm.ended) tryPlay();
    }, 2000);
  }
  // 登录成功时停止
  var origLogin = document.getElementById("btn-login");
  if(origLogin){
    var oldClick = origLogin.onclick;
    origLogin.addEventListener("click", function(){
      // 监听登录结果
      var check = setInterval(function(){
        if(localStorage.getItem("token")){
          if(bgm) bgm.pause();
          clearInterval(check);
        }
      }, 500);
      setTimeout(function(){ clearInterval(check); }, 10000);
    });
  }
})();
</script>
