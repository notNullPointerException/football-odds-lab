<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心 · AI Football</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0d0f14;
  color: #e6e9ef;
  min-height: 100vh;
}
.header {
  display: flex;
  align-items: center;
  padding: 16px 24px;
  border-bottom: 1px solid #2a2e38;
  background: #12141a;
}
.header a { color: #8b93a5; text-decoration: none; margin-right: 16px; }
.header h1 { font-size: 18px; font-weight: 600; }
.container { max-width: 720px; margin: 40px auto; padding: 0 20px; }
.card {
  background: #161920;
  border: 1px solid #2a2e38;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
}
.card h2 { font-size: 16px; margin-bottom: 16px; color: #fff; }
.info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2a2e38; }
.info-row:last-child { border-bottom: none; }
.info-row .label { color: #8b93a5; }
.info-row .value { font-weight: 500; }
select, button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  margin-top: 8px;
}
select {
  background: #1e222b;
  border: 1px solid #2a2e38;
  color: #e6e9ef;
}
.btn {
  background: #4a9eff;
  color: #fff;
  border: none;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover { background: #3a8eef; }
.ticker {
  height: 36px;
  overflow: hidden;
  background: rgba(74,158,255,.08);
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 13px;
  line-height: 36px;
  padding: 0 12px;
  color: #8b93a5;
}
.ticker-inner {
  white-space: nowrap;
  animation: ticker 25s linear infinite;
}
@keyframes ticker {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}
.back { color: #4a9eff; cursor: pointer; }
</style>
</head>
<body>
<div class="header">
  <a href="/" class="back">← 返回</a>
  <h1>个人中心</h1>
</div>
<div class="container">
  <div class="ticker" id="ticker">
    <div class="ticker-inner" id="ticker-inner">加载中…</div>
  </div>

  <div class="card" id="user-card">
    <h2>账户信息</h2>
    <div class="info-row"><span class="label">用户</span><span class="value" id="uc-username">-</span></div>
    <div class="info-row"><span class="label">角色</span><span class="value" id="uc-role">-</span></div>
    <div class="info-row"><span class="label">到期</span><span class="value" id="uc-expires">-</span></div>
  </div>

  <div class="card">
    <h2>充值会员</h2>
    <select id="recharge-plan">
      <option value="week">周卡 · ¥188</option>
      <option value="month">月卡 · ¥588</option>
      <option value="quarter">季卡 · ¥1488</option>
      <option value="year">年卡 · ¥4888</option>
    </select>
    <button class="btn" id="btn-recharge">确认充值</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

async function loadUser() {
  const token = localStorage.getItem("token");
  if (!token) { location.href = "/login.html"; return; }
  try {
    const r = await fetch("/api/auth/me", { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) { location.href = "/login.html"; return; }
    const me = await r.json();
    $("#uc-username").textContent = me.username || "-";
    $("#uc-role").textContent = me.role || "-";
    $("#uc-expires").textContent = me.expires_at ? String(me.expires_at).slice(0,10) : "未开通";
    if (me.role === "admin") {
      document.querySelector(".card:last-of-type").style.display = "none";
    }
  } catch(e) {
    location.href = "/login.html";
  }
}

async function loadTicker() {
  try {
    const r = await fetch("/api/auth/recharge-ticker");
    const data = await r.json();
    const inner = $("#ticker-inner");
    if (!data || !data.length) { inner.textContent = "暂无充值动态"; return; }
    const plans = {week:"周卡", month:"月卡", quarter:"季卡", year:"年卡"};
    const html = data.map(d => `${d.username} 在 ${d.time} 充值了${plans[d.plan]||d.plan} ¥${d.amount}`).join("　　");
    inner.textContent = html + "　　" + html;
  } catch(e) {
    $("#ticker-inner").textContent = "加载失败";
  }
}

$("#btn-recharge").onclick = () => {
  const plan = $("#recharge-plan").value;
  alert("请扫码支付后联系管理员激活（套餐：" + plan + "）");
  // TODO: 跳转到支付页或弹出二维码
};

loadUser();
loadTicker();
setInterval(loadTicker, 5 * 60 * 1000);
</script>
</body>
</html>
