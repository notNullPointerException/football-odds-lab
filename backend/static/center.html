<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心 · AI Football</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0d0f14;
  color: #e6e9ef;
  min-height: 100vh;
}
.header {
  display: flex;
  align-items: center;
  padding: 16px 24px;
  border-bottom: 1px solid #2a2e38;
  background: #12141a;
}
.header a { color: #8b93a5; text-decoration: none; margin-right: 16px; }
.header h1 { font-size: 18px; font-weight: 600; }
.container { max-width: 720px; margin: 40px auto; padding: 0 20px; }
.card {
  background: #161920;
  border: 1px solid #2a2e38;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
}
.card h2 { font-size: 16px; margin-bottom: 16px; color: #fff; }
.info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2a2e38; }
.info-row:last-child { border-bottom: none; }
.info-row .label { color: #8b93a5; }
.info-row .value { font-weight: 500; }
select, button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  margin-top: 8px;
}
select {
  background: #1e222b;
  border: 1px solid #2a2e38;
  color: #e6e9ef;
}
.btn {
  background: #4a9eff;
  color: #fff;
  border: none;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover { background: #3a8eef; }
.ticker {
  height: 48px;
  overflow: hidden;
  background: rgba(74,158,255,.1);
  border-radius: 10px;
  margin-bottom: 24px;
  font-size: 15px;
  line-height: 48px;
  padding: 0 20px;
  color: #a0a8b8;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}
.ticker-inner {
  white-space: nowrap;
  display: inline-block;
}


.back { color: #4a9eff; cursor: pointer; }
</style>
</head>
<body>
<div class="header">
  <a href="/" class="back" style="font-size:20px;color:#4a9eff;font-weight:600;">← 返回</a>
  <h1 style="font-size:20px;">个人中心</h1>
  
</div>
<div class="container" style="position:relative;">
  
  <div class="ticker" id="ticker">
    <div class="ticker-inner" id="ticker-inner">加载中…</div>
  </div>

  <div class="card" id="user-card" style="position:relative;">
    <a href="/" style="position:absolute;top:12px;right:16px;font-size:20px;color:#8b93a5;text-decoration:none;">✕</a>
    <h2>账户信息</h2>
    <div class="info-row"><span class="label">用户</span><span class="value" id="uc-username">-</span></div>
    <div class="info-row"><span class="label">角色</span><span class="value" id="uc-role">-</span></div>
    <div class="info-row"><span class="label">到期</span><span class="value" id="uc-expires">-</span></div>
  </div>

  <div class="card">
    <h2>充值会员</h2>
    <select id="recharge-plan">
      <option value="week">周卡 · ¥188</option>
      <option value="month">月卡 · ¥588</option>
      <option value="quarter">季卡 · ¥1488</option>
      <option value="year">年卡 · ¥4888</option>
    </select>
    <button class="btn" id="btn-recharge">确认充值</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

async function loadUser() {
  const token = localStorage.getItem("token");
  if (!token) { location.href = "/login.html"; return; }
  try {
    const r = await fetch("/api/auth/me", { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) { location.href = "/login.html"; return; }
    const me = await r.json();
    $("#uc-username").textContent = me.username || "-";
    $("#uc-role").textContent = me.role || "-";
    const expEl = $("#uc-expires");
    if (me.role === "admin") {
      expEl.textContent = "无限制";
      expEl.style.color = "#f87171";
      document.querySelector(".card:last-of-type").style.display = "none";
    } else if (!me.expires_at) {
      expEl.textContent = "未开通";
      expEl.style.color = "#8b93a5";
    } else {
      // 倒计时
      const exp = new Date(me.expires_at);
      function updateCountdown() {
        const now = new Date();
        const diff = exp - now;
        if (diff <= 0) {
          expEl.textContent = "已过期";
          expEl.style.color = "#f87171";
          return;
        }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        expEl.textContent = d + "天 " + h + "小时 " + m + "分";
        expEl.style.color = d < 3 ? "#f87171" : "#4ade80";
      }
      updateCountdown();
      setInterval(updateCountdown, 60000);
    }
  } catch(e) {
    location.href = "/login.html";
  }
}

let tickerData = [];
let tickerIndex = 0;
async function loadTicker() {
  try {
    const r = await fetch("/api/auth/recharge-ticker");
    tickerData = await r.json() || [];
    if (!tickerData.length) {
      $("#ticker-inner").textContent = "暂无充值动态";
      return;
    }
    // 周卡优先，其次月卡，最后年卡；同类型内打乱
    const order = {week: 0, month: 1, quarter: 2, year: 3};
    tickerData.sort((a, b) => {
      const oa = order[a.plan] ?? 9;
      const ob = order[b.plan] ?? 9;
      if (oa !== ob) return oa - ob;
      return Math.random() - 0.5;
    });
    tickerIndex = 0;
    $("#ticker-inner").textContent = "";
    setTimeout(showNextTicker, 5000);
  } catch(e) {
    $("#ticker-inner").textContent = "加载失败";
  }
}
function showNextTicker() {
  if (!tickerData.length) return;
  const d = tickerData[tickerIndex % tickerData.length];
  const plans = {week:"周卡", month:"月卡", quarter:"季卡", year:"年卡"};
  const inner = $("#ticker-inner");
  const fullText = `${d.username} 在 ${d.time} 充值了${plans[d.plan]||d.plan} ¥${d.amount}`;
  inner.textContent = "";
  let i = 0;
  const type = () => {
    if (i < fullText.length) {
      inner.textContent += fullText[i];
      i++;
      setTimeout(type, 80);
    }
  };
  type();
  tickerIndex++;
  // 第一条 5 秒，前几条 10-60 秒，之后 2-3 分钟
  let delay;
  if (tickerIndex === 1) delay = 5000;
  else if (tickerIndex <= 3) delay = 10000 + Math.random() * 50000;
  else delay = 120000 + Math.random() * 60000;
  setTimeout(showNextTicker, delay);
}

$("#btn-recharge").onclick = () => {
  const plan = $("#recharge-plan").value;
  alert("请扫码支付后联系管理员激活（套餐：" + plan + "）");
  // TODO: 跳转到支付页或弹出二维码
};

loadUser();
loadTicker();
setInterval(loadTicker, 5 * 60 * 1000);
</script>
</body>
</html>
